[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radarkit"
version = "0.1.2"
description = "Building blocks for web radars: careers-board fetchers, notify channels, Telegram, Jev, Workers AI, sqlite/D1 store"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["radarkit*"]
